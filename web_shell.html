<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Boy emulator</title>
  <meta name="description" content="Game Boy emulator made by Kingofpottatoes, written in C and powered by raylib">

  <style>
    :root {
      --bg: #0e0f13;
      --panel: #171920;
      --border: #2a2d38;
      --text: #e6e6e6;
      --muted: #8a8f9c;
      --eight: #4ade80;
      --pressed: #4ade80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
    }

    h1 span { color: var(--eight); }

    .row {
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      width: 100%;
      gap:16px;
      align-items:center;
    }
    .row-files{
      gap:16px;
      align-items:center;
    }
    .colors {
      justify-self: end;
    }
    .screen {
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .volume{
      justify-self: start;
      gap:8px;
      display: flex;
      flex-direction: column; 
      align-items: center;
    }
    input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      height: 200px;
    }

    canvas.emscripten {
      display: block;
      border: none;
      background: black;
      image-rendering: pixelated;
      outline: none;
    }

    #rom-input {display:none;}

    .filebtn {
      display: inline-flex;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      height: 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      gap:16px;
    }
    .filebtn:hover{
      background:  var(--pressed);
      color: black
    }
    #rom-input:disabled + #file-selector{
      opacity:0.4;
      cursor:not-allowed;
    }

    .keys {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .keypad { text-align: center; }

    .keypad p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .grid {
      justify-content: center;
      display: grid;
      grid-template-columns: repeat(4, 36px);
      gap: 6px;
    }

    .grid button {
      color: var(--text);
      font: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
    }
    .grid button.pressed {
      color: black;
      font: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      background-color: var(--pressed) ;
    }
    .grid button.waiting{
      border-color: aqua;
    }
    .grid button.conflict{
      border-color: red;
    }
    
    .gb {
      position:absolute;
      bottom: 2px;
      right: 4px;
      font-size: 0.55rem;
      color: var(--muted);
    }

    footer {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <h1>Game <span>Boy</span> EMULATOR</h1>
  <div class="row">
    <div class="colors">
      <p>Colors</p>
   </div>
   <div class="screen">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
   <div class="volume">
      <p>Volume</p>
      <input id="volume" type="range" min="0" max="100">
   </div>
</div>
  <div class="row-files">
    <label id="file-selector" class="filebtn" for="rom-input">Load ROM</label>
    <input type="file" accept=".gb" id="rom-input" disabled>
    <button id="save" class="filebtn">Save</button>
  </div>
  <span id="rom-name"></span>

  <div class="keys">
    <div class="keypad">
      <p>Controls - Click a key to remap</p>
      <div class="grid">
        <!-- Controls -->
        <button data-key="4">
          <span class="gb">A</span>
          <span class="bind">Q</span>
        </button>
        <button data-key="5">
          <span class="gb">B</span>
          <span class="bind">D</span>
        </button>
        <button data-key="6">
          <span class="gb">Select</span>
          <span class="bind">Z</span>
        </button>
        <button data-key="7">
          <span class="gb">Start</span>
          <span class="bind">S</span>
        </button>
        <!-- Joystick -->
        <button data-key="2">
          <span class="gb">↑</span>
          <span class="bind">↑</span>
        </button>
        <button data-key="3">
          <span class="gb">↓</span>
          <span class="bind">↓</span>
        </button>
        <button data-key="0">
          <span class="gb">→</span>
          <span class="bind">→</span>
        </button>
        <button data-key="1">
          <span class="gb">←</span>
          <span class="bind">←</span>
        </button>
      </div>
    </div>
  </div>

  <footer>Written in C, compiled to WebAssembly with Emscripten · powered by raylib</footer>

  <script>
    let keymap = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "KeyA", "KeyD", "KeyW", "KeyS"]; 
    let Display_rebind_Map ={
      "ArrowRight":"→",
      "ArrowLeft":"←",
      "ArrowUp":"↑",
      "ArrowDown":"↓",
    }
    let state = 0;
    let waiting=-1;
    let ready=false;
    let rom_name;
    const rom_input = document.getElementById("rom-input");
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized:()=>{ready=true; rom_input.disabled = false;}
    };
    const volume = document.getElementById("volume");
    const save=document.getElementById("save");

    function get_display_text(char){
      char = Display_rebind_Map[char] ?? char
      return char.toUpperCase()
    }
    function Send_keyboard(){
      if(!ready){
        return
      }
      Module.ccall("web_set_keyboard",null,["number"],[state])
    }
    function getButton(k){
      return document.querySelector('[data-key="' + k + '"]')
    }
    window.addEventListener("keydown", (event)=>{
      if (waiting!==-1){
        event.preventDefault();
        const button=getButton(waiting);
        const j = keymap.indexOf(event.code);
        if(j!==-1 && j!=waiting){
           button.classList.add("conflict")
          return
        }
        if (event.code=="Escape"){
          waiting=-1;
          button.classList.remove("waiting")
          button.classList.remove("conflict")
          return
        }
        button.querySelector(".bind").textContent = get_display_text(event.key);
        keymap[waiting] = event.code;
        button.classList.remove("waiting");
        button.classList.remove("conflict")
        waiting=-1;
        return
      }
      const k= keymap.indexOf(event.code);
      if (k===-1){
        return
      }
      event.preventDefault();
      if (event.repeat){
        return
      }
      state |= (1<<k); //light the bit
      document.querySelector('[data-key="'+k+'"]').classList.add("pressed");
      Send_keyboard();


    })
    window.addEventListener("keyup", (event)=>{
      const k= keymap.indexOf(event.code);
      if (k===-1){
        return
      }
      event.preventDefault();
      state &= ~(1 << k); //shut down the bit
      document.querySelector('[data-key="'+k+'"]').classList.remove("pressed");
      Send_keyboard();

    })
    document.querySelectorAll("[data-key]").forEach((button)=>{
        button.addEventListener("click", ()=>{
          const oldbutton=getButton(waiting)
          if (waiting!==-1){
            oldbutton.classList.remove("waiting")
            oldbutton.classList.remove("conflict")
          }
          waiting=Number(button.dataset.key);
          button.classList.add("waiting")
          button.blur();

        })
    })

    rom_input.addEventListener("change",async () => {
      const file= rom_input.files[0];
      if(!file){return}
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      Module.FS.writeFile("/rom.gb", bytes);
      Module.ccall("load",null,["string"], ["/rom.gb"]);
      document.getElementById("rom-name").textContent = file.name;
      rom_name=file.name
      rom_input.value = "";
      rom_input.blur();
     })
    volume.addEventListener("input", ()=>{
      Module.ccall("set_volume",null,["number"],[Number(volume.value)/100]);
    })

    save.addEventListener("click",()=>{
      Module._save();
      try {
        const blob = new Blob([Module.FS.readFile("/rom.sav")], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = document.getElementById("rom-name").textContent.replace(".gb",".sav");
        a.click();
        URL.revokeObjectURL(url);
      }
      catch {
        document.getElementById("rom-name").textContent = "save of"+ document.getElementById("rom-name").textContent + "failed.";
      }
    })
  </script>
  {{{ SCRIPT }}}
</body>
</html>
